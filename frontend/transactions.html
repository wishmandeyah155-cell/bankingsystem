<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transactions | Secure Banking Application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">SB</div>
          <div>
            <p>Secure</p>
            <strong>Banking</strong>
          </div>
        </div>

        <nav class="nav-menu" aria-label="Sidebar navigation">
          <a class="nav-item" href="dashboard.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-9.5Z"/></svg>
            <span>Dashboard</span>
          </a>
          <a class="nav-item" href="accounts.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Zm2.5-.5h11a.5.5 0 0 1 .5.5v1H6V7.5a.5.5 0 0 1 .5-.5Zm-1 4h12v5.5a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5V11Z"/></svg>
            <span>My Accounts</span>
          </a>
          <a class="nav-item active" href="transactions.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-11Zm3 1.5h12v2H6V8Zm0 4h7v2H6v-2Zm0 4h5v2H6v-2Z"/></svg>
            <span>Transactions</span>
          </a>
          <button type="button" class="nav-item button-link" data-modal="depositModal">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>
            <span>Deposit</span>
          </button>
          <button type="button" class="nav-item button-link" data-modal="withdrawModal">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v2H5v-2Z"/></svg>
            <span>Withdraw</span>
          </button>
          <button type="button" class="nav-item button-link logout-link" id="logoutButton">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17v-2h7V9h-7V7l-5 5 5 5Zm-7-8h2V5h12v14H5v-4H3v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v5Z"/></svg>
            <span>Logout</span>
          </button>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p class="eyebrow muted">History</p>
            <h1>Transactions</h1>
          </div>
          <div class="topbar-right">
            <button type="button" class="btn btn-primary" data-modal="depositModal">Deposit</button>
          </div>
        </header>

        <section class="panel filter-panel">
          <div class="toolbar">
            <label class="search-box" aria-label="Search transactions">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.95 12.3l4.35 4.35 1.4-1.4-4.35-4.35A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
              <input id="transactionSearch" type="search" placeholder="Search by transaction ID" />
            </label>

            <select id="transactionTypeFilter" class="select-control">
              <option value="all">All types</option>
              <option value="DEPOSIT">Deposit</option>
              <option value="WITHDRAWAL">Withdrawal</option>
            </select>

            <input id="transactionDateFilter" type="date" class="select-control" />

            <button type="button" class="btn btn-secondary small-btn" id="clearFiltersBtn">Clear filters</button>
          </div>
        </section>

        <section class="panel table-panel">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Transaction ID</th>
                  <th>Account</th>
                  <th>Type</th>
                  <th>Date</th>
                  <th>Amount</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="allTransactionsBody">
                <tr>
                  <td colspan="6" class="empty-state-cell">No transaction history available.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div class="modal hidden" id="depositModal" aria-hidden="true">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Deposit funds</h3>
          <button type="button" class="close-modal" aria-label="Close deposit dialog">×</button>
        </div>
        <form id="depositForm" class="modal-form">
          <div class="form-group">
            <label for="depositAccount">Account</label>
            <select id="depositAccount" name="depositAccount"></select>
          </div>
          <div class="form-group">
            <label for="depositAmount">Amount</label>
            <input id="depositAmount" name="depositAmount" type="number" min="0.01" step="0.01" placeholder="0.00" />
          </div>
          <div class="transaction-summary">
            <span>Transaction summary</span>
            <strong id="depositSummary">$0.00</strong>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-close-modal="depositModal">Cancel</button>
            <button type="submit" class="btn btn-primary">Confirm deposit</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal hidden" id="withdrawModal" aria-hidden="true">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Withdraw funds</h3>
          <button type="button" class="close-modal" aria-label="Close withdraw dialog">×</button>
        </div>
        <form id="withdrawForm" class="modal-form">
          <div class="form-group">
            <label for="withdrawAccount">Account</label>
            <select id="withdrawAccount" name="withdrawAccount"></select>
          </div>
          <div class="form-group">
            <label for="withdrawAmount">Amount</label>
            <input id="withdrawAmount" name="withdrawAmount" type="number" min="0.01" step="0.01" placeholder="0.00" />
          </div>
          <div class="transaction-summary">
            <span>Available balance</span>
            <strong id="withdrawSummary">$0.00</strong>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-close-modal="withdrawModal">Cancel</button>
            <button type="submit" class="btn btn-primary">Confirm withdrawal</button>
          </div>
        </form>
      </div>
    </div>

    <script src="scripts/app.js"></script>
    <script src="scripts/dashboard.js"></script>
  </body>
</html>
